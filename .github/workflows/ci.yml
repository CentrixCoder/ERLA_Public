name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # the release workflow runs this first and publishes only if it passes

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nothing private, manifests agree
        run: python scripts/check_public.py .
      - name: Python sources compile
        run: python -m compileall -q plugins/erla/server/erla plugins/erla/scripts
      - name: Plugin zip builds
        run: |
          cd plugins/erla
          zip -qr -X ../../erla-plugin.zip . -x '*__pycache__*'
          cd ../..
          unzip -l erla-plugin.zip | grep -q '.claude-plugin/plugin.json'
