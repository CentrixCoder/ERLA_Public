[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erla"
version = "0.4.0"
description = "Engineering Research Library Agent - local engineering library indexer and search"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "xlrd>=2.0",
    "olefile>=0.47",
    "pytesseract>=0.3.10",
    "pywin32>=306; sys_platform == 'win32'",
    "fastembed>=0.9",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "pint>=0.24",
    "mcp>=2.3,<3",
]

[project.scripts]
erla = "erla.cli:main"
erla-mcp = "erla.mcp_server:main"

[tool.setuptools.packages.find]
include = ["erla*"]

[tool.setuptools.package-data]
erla = ["core/**/*"]
